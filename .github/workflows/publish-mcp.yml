name: Publish to MCP Registry

# The registry grants the io.github.<owner>/* namespace from the OIDC claim of a
# workflow in a repo that owner owns. The `mcp-publisher login github` device flow
# cannot reach an org namespace from a developer machine: it grants only the
# personal namespace unless the registry's GitHub App is installed on the org, and
# that app ("MCP Registry Login (Prod)") is private, so no third party can install
# it. This workflow is therefore the only route for io.github.probe402/*.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token the registry authenticates
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          # sha256 from registry_1.8.1_checksums.txt in the same release
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in via GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
